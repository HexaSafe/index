<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Wallet</title>
  <script>
    // ✅ Redirect to login if not logged in
    if (localStorage.getItem("isLoggedIn") !== "true") {
      window.location.href = "login.html";
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: #f0f2f5;
      font-family: 'Arial', sans-serif;
    }

    .wallet-container {
      max-width: 400px;
      margin: 0 auto;
      background-color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .wallet-header {
      background-color: #2979ff;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .balance {
      font-size: 30px;
      margin-top: 10px;
    }

    .wallet-actions {
      display: flex;
      justify-content: space-around;
      padding: 15px 0;
      background-color: #e3f2fd;
    }

    .wallet-actions button {
      background: none;
      border: none;
      font-size: 14px;
      color: #1976d2;
      cursor: pointer;
    }

    .coin-section {
      padding: 10px 15px;
      flex: 1;
      overflow-y: auto;
    }

    .coin {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .coin-info {
      display: flex;
      align-items: center;
    }

    .coin-icon {
      width: 32px;
      height: 32px;
      background-color: #ccc;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #fff;
      margin-right: 10px;
      font-size: 12px;
    }

    .coin-name {
      font-weight: bold;
    }

    .coin-amount {
      text-align: right;
      color: #555;
    }

    .nav {
      display: flex;
      justify-content: space-around;
      background-color: #fafafa;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }

    .nav-item {
      font-size: 13px;
      color: #777;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.active {
      color: #2979ff;
      font-weight: bold;
    }

    @media (max-height: 600px) {
      .coin-section {
        padding-bottom: 80px;
      }
    }
  </style>
</head>
<body>

  <div class="wallet-container">
    <!-- Header -->
    <div class="wallet-header">
      My Wallet
      <div class="balance">$0</div>
    </div>

    <!-- Actions -->
    <div class="wallet-actions">
      <button>Send</button>
      <button>Receive</button>
      <button>Buy</button>
      <button>Trade</button>
    </div>

    <!-- Coin List -->
    <div class="coin-section">
      <div class="coin">
        <div class="coin-info">
          <div class="coin-icon">T</div>
          <div class="coin-name">Trump</div>
        </div>
        <div class="coin-amount">0</div>
      </div>
      <div class="coin">
        <div class="coin-info">
          <div class="coin-icon">OM</div>
          <div class="coin-name">OM</div>
        </div>
        <div class="coin-amount">0</div>
      </div>
      <div class="coin">
        <div class="coin-info">
          <div class="coin-icon">W</div>
          <div class="coin-name">WLD</div>
        </div>
        <div class="coin-amount">0</div>
      </div>
      <div class="coin">
        <div class="coin-info">
          <div class="coin-icon">P</div>
          <div class="coin-name">PNUT</div>
        </div>
        <div class="coin-amount">0</div>
      </div>
      <div class="coin">
        <div class="coin-info">
          <div class="coin-icon">S</div>
          <div class="coin-name">SOL</div>
        </div>
        <div class="coin-amount">0</div>
      </div>
      <div class="coin">
        <div class="coin-info">
          <div class="coin-icon">M</div>
          <div class="coin-name">MELANIA</div>
        </div>
        <div class="coin-amount">0</div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav">
      <a class="nav-item active" href="wallet.html">Wallet</a>
      <a class="nav-item" href="transaction.html">Transactions</a>
	<a class="nav-item" href="https://www.exodus.com/desktop">exodus</a>
      <a class="nav-item" href="settings.html">Settings</a>
    </div>
  </div>

</body>
</html>
